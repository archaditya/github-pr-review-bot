# Local development — all ports exposed, hot reload, envs loaded directly.
# Start with: make dev  (wraps: docker compose -f docker-compose.local.yml up --build)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/localdevpass
      - NEO4J_server_memory_heap_initial__size=128m
      - NEO4J_server_memory_heap_max__size=256m
    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data_local:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
      target: dev
    env_file: apps/ai-service/.env
    ports:
      - "${AI_SERVICE_PORT}:8000"
    volumes:
      - ./apps/ai-service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  indexer-service:
    build:
      context: ./apps/indexer-service
      dockerfile: Dockerfile
      target: dev
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=localdevpass
    ports:
      - "8001:8001"
    volumes:
      - ./apps/indexer-service:/app
      - indexer_tmp_local:/tmp/repos
    depends_on:
      - neo4j
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: dev
    env_file: apps/api/.env
    ports:
      - "${API_PORT}:4000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
      indexer-service:
        condition: service_started
      redis:
        condition: service_healthy
    command: npm run dev

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${WEB_PORT}:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: npm run dev

  # Inngest Dev Server — local UI for inspecting event/job runs (ADR-005)
  inngest:
    image: inngest/inngest:latest
    command: inngest dev -u http://api:4000/api/inngest
    ports:
      - "8288:8288"
    depends_on:
      - api

volumes:
  postgres_data_local:
  neo4j_data_local:
  redis_data_local:
  indexer_tmp_local:
