# Production — immutable images, no bind mounts, secrets via env_file pointing at
# deploy-time secret files (ADR-008). Postgres and ai-service are never exposed on the
# host — only reachable on the internal Docker network. api/web ports ARE exposed
# directly so an externally-managed reverse proxy (set up separately, outside this repo)
# can route to them.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./secrets/postgres.env
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No `ports:` — reachable only on the internal network

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file: ./secrets/ai-service.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    # No `ports:` — reachable only from `api` on the internal network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file: ./secrets/api.env
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file: ./secrets/web.env
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres_data_prod:
