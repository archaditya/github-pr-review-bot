# Production — immutable images, no bind mounts, secrets via env_file pointing at
# deploy-time secret files (ADR-008). Postgres, ai-service, indexer-service, neo4j,
# and redis are never exposed on the host — only reachable on the internal Docker
# network. api/web ports ARE exposed directly so an externally-managed reverse proxy
# (set up separately, outside this repo) can route to them.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./secrets/postgres.env
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No `ports:` — reachable only on the internal network

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    env_file: ./secrets/indexer-service.env
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-archadi_prod_neo4j_sec_88492019384729182}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
    volumes:
      - neo4j_data_prod:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    # No `ports:` — reachable only on the internal network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No `ports:` — reachable only on the internal network

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file: ./secrets/ai-service.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    # No `ports:` — reachable only from `api` on the internal network

  indexer-service:
    build:
      context: ./apps/indexer-service
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file: ./secrets/indexer-service.env
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - indexer_tmp_prod:/tmp/repos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    # No `ports:` — reachable only from `api` on the internal network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file: ./secrets/api.env
    ports:
      - "${API_PORT:-4050}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      indexer-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file: ./secrets/web.env
    ports:
      - "${WEB_PORT:-3050}:3000"
    depends_on:
      - api

volumes:
  postgres_data_prod:
  neo4j_data_prod:
  redis_data_prod:
  indexer_tmp_prod:
